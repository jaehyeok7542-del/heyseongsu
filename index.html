<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>헤이성수</title>

  <!-- ▼ PWA(폰에 설치되는 앱)를 위한 설정들 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1f4fd8">
  <!-- 아이폰용: 홈 화면에 추가했을 때 보이는 아이콘과 앱처럼 열리게 하는 설정 -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="헤이성수">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 모든 화면이 이 상자 안에 그려져요. 화면이 바뀌면 안의 내용만 바뀌어요. -->
  <div id="app"></div>
  <div id="toast" class="toast" hidden></div>

  <!-- 자바스크립트 파일들 (순서가 중요해요! 위에 있는 것부터 읽혀요) -->
  <script src="js/config.js"></script>   <!-- 카카오맵 키 등 설정 -->
  <script src="js/data.js"></script>     <!-- 건물 목록, 저장소 -->
  <script src="js/rules.js"></script>    <!-- 광고 규격 기준표 + 진단 -->
  <script src="js/ui.js"></script>       <!-- 화면 이동(go), 공통 도구 -->
  <script src="js/home.js"></script>     <!-- 첫 화면 -->
  <script src="js/advertiser.js"></script> <!-- 광고주용 화면들 -->
  <script src="js/admin.js"></script>    <!-- 구청용 화면들 -->
  <script src="js/tourist.js"></script>  <!-- 관광객용 화면 (나중에!) -->
  <script src="js/main.js"></script>     <!-- 시작 버튼 -->
</body>
</html>
